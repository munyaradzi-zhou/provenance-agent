# Runs automatically on `git commit` after `pre-commit install`.
#
# Design note (Windows dev machine): we keep ONLY the ruff hooks here.
# ruff ships as a native binary, so it runs in ~3s. The generic
# `pre-commit-hooks` (trailing-whitespace, end-of-file-fixer, check-yaml,
# check-added-large-files) each spawn a fresh *isolated Python interpreter*,
# which Windows Defender re-scans on every spawn -> ~20s each, ~80s+ per commit.
# Their value is otherwise covered:
#   - ruff-format fixes trailing whitespace + final newlines on .py files
#   - .gitattributes normalizes line endings (LF) across the repo
#   - .gitignore + review keep the large corpus out of git
# mypy is intentionally CI-only (see note below) so commits stay fast.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff              # lint (auto-fixes what it safely can)
        args: ["--fix"]
      - id: ruff-format       # format

# mypy is NOT a pre-commit hook: its isolated env lacks our real deps
# (langgraph, neo4j, ...), making it both slow (~2.5 min) and less accurate.
# Type-checking is enforced authoritatively in CI (full deps) and available
# locally via `.\tasks.ps1 type` / `make type`.
