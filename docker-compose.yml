services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [neo4j, qdrant]

  neo4j:
    image: neo4j:5.19
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/password

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
